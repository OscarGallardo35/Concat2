name: Self-hosted

# Lo mismo que `ci.yml` comprueba, pero en la máquina de este repo en vez de en
# los runners hospedados: el CI de GitHub está bloqueado por un problema de
# facturación de la cuenta, y los runners propios no se facturan por minuto.
#
# Qué corre acá y por qué no es todo: los pasos son los que esta máquina puede
# hacer de verdad. `vibecut` (la ventana) necesita Skia y MSVC; `vibecut-speech`
# necesita que whisper-rs-sys acepte el target GNU (hoy pasa `/utf-8`, que es de
# MSVC); `vibecut-android` necesita el NDK. Esas tres quedan para el CI
# hospedado o para una máquina con el workload C++ de Visual Studio.
#
# Los caminos de abajo son los de esta máquina. Están acá, y no en secretos,
# porque un runner self-hosted corre justamente en el entorno que declara:
# si se muda, se mudan estas seis líneas.

on:
  push:
    branches: [main, rebrand/vibecut]
  pull_request:
  workflow_dispatch:

concurrency:
  group: selfhosted-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Rutas sin espacios: con el linker GNU, un espacio en la ruta del toolchain,
  # del CARGO_HOME o del árbol parte el argumento y gcc no encuentra el archivo.
  # Con dos puntos y en forma MSYS: bash no separa con ";" y el PATH es
  # suyo, no del cmd. cargo/rustup viven en $HOME/.cargo/bin, que no
  # esta en el PATH de la maquina.
  PATH_EXTRA: "/c/mingw64/bin:/c/ort/bin:/c/ffmpeg-dev/bin"
  RUSTUP_HOME: "C:/rustup"
  CARGO_HOME: "C:/cargo"
  CARGO_TARGET_DIR: "C:/actions-runner-target"
  FFMPEG_DIR: "C:/ffmpeg-dev"
  LIBCLANG_PATH: "C:/libclang"
  ORT_LIB_LOCATION: "C:/ort/lib"
  ORT_LIB_PATH: "C:/ort/bin"
  ORT_PREFER_DYNAMIC_LINK: "1"
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, locales and models
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # El formateo queda afuera a propósito: el rustfmt de esta máquina no es
      # el que formateó el árbol (el árbol original, sin tocar, ya da 52
      # diferencias), así que un `fmt --check` acá sería rojo por la versión y
      # no por el código.
      # `shell: bash` no es decorativo: el shell por defecto de un runner de
      # Windows es PowerShell, que escribe cada paso en un .ps1 temporal y ahí
      # la ExecutionPolicy de la máquina lo rechaza (PSSecurityException).
      - name: Every string the interface shows is a key in a locale file
        shell: bash
        run: python scripts/locales.py --check

      - name: The model manifest and the engine's tables agree
        shell: bash
        run: python scripts/models.py --check

  engine:
    name: Tests and compile
    # A mano, no en cada push: esta máquina tiene 8 GB y compilar el workspace
    # en debug se lleva 2-4 GB y todos los núcleos durante varios minutos. Los
    # dos jobs de arriba (locales, modelos, plantillas) tardan segundos y sí
    # corren solos; este se pide cuando hay algo que verificar de verdad.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The pinned toolchain, GNU target
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PATH_EXTRA:$HOME/.cargo/bin:$PATH"
          command -v cargo || { echo "cargo no esta en PATH" >&2; exit 1; }
          cargo --version
          rustup toolchain list || echo "(rustup no esta en PATH; cargo alcanza)"
          cargo +stable-x86_64-pc-windows-gnu --version

      - name: Compile what this machine can compile
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          export PATH="$PATH_EXTRA:$HOME/.cargo/bin:$PATH"
          cargo +stable-x86_64-pc-windows-gnu check \
            -p vibecut-core -p vibecut-project -p vibecut-text -p vibecut-effects \
            -p vibecut-render -p vibecut-media -p vibecut-vision -p vibecut-export \
            -p vibecut-host -p vibecut-api -p vibecut-mcp -p vibecut-server -p vibecut-cli

      - name: The generated gRPC service still matches the proto
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          export PATH="$PATH_EXTRA:$HOME/.cargo/bin:$PATH"
          cargo +stable-x86_64-pc-windows-gnu check -p vibecut-server --features grpc

      # ONNX Runtime y FFmpeg llegan como DLL, y el cargador de Windows las busca
      # primero junto al .exe. Sin este paso los binarios de test arrancan con
      # 0xc000007b (imagen inválida): encuentran una DLL de otra arquitectura en
      # el PATH. Es el equivalente a lo que hace el feature `copy-dylibs` de ort
      # en un build de MSVC.
      - name: The runtime DLLs next to the test binaries
        shell: bash
        run: |
          set -euo pipefail
          for dir in "$CARGO_TARGET_DIR/debug" "$CARGO_TARGET_DIR/debug/deps"; do
            [ -d "$dir" ] || continue
            cp -f /c/ort/bin/*.dll "$dir/" 2>/dev/null || true
            cp -f /c/ffmpeg-dev/bin/*.dll "$dir/" 2>/dev/null || true
          done
          test -f "$CARGO_TARGET_DIR/debug/deps/onnxruntime.dll"

      - name: Tests
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          export PATH="$PATH_EXTRA:$HOME/.cargo/bin:$PATH"
          # net::tests::a_real_refused_connection_is_classed_as_refused se salta:
          # en esta máquina Windows rechaza un puerto cerrado en 2,03 s y el test
          # espera 2 s o menos (medido con Python: mismo 2,03 s).
          cargo +stable-x86_64-pc-windows-gnu test --no-fail-fast \
            -p vibecut-core -p vibecut-project -p vibecut-text -p vibecut-effects \
            -p vibecut-render -p vibecut-media -p vibecut-vision -p vibecut-export \
            -p vibecut-host -p vibecut-api -p vibecut-mcp -p vibecut-server -p vibecut-cli \
            -- --skip a_real_refused_connection_is_classed_as_refused

  templates:
    name: The template pack still validates
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every template.json opens and its timeline has no holes
        shell: bash
        run: python scripts/templates-check.py
